# Coloque este arquivo em:  .github/workflows/build-apk.yml
#
# O que faz: compila o app e deixa o APK para baixar na aba Actions (em "Artifacts").
#  - A cada push na branch main (ou manualmente, em Actions > Build APK > Run workflow).
#  - Debug por padrão. Manualmente você pode escolher "release".
#  - Se existir o segredo GOOGLE_SERVICES_JSON, o build já sai COM push (Firebase).
#  - Para release assinado, crie os segredos do keystore (veja o passo a passo do chat).
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: "Tipo de build"
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VARIANT: ${{ github.event.inputs.variant || 'debug' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (aceita as licenças)
        uses: android-actions/setup-android@v3

      # Se a pasta gradle/ (wrapper) estiver no repositório, usa o wrapper.
      # Se não estiver, usa uma versão do Gradle instalada pelo Actions.
      - name: Verificar o Gradle wrapper
        id: wrapper
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning::gradle/wrapper não encontrado; usando o Gradle 9.1.0 do Actions. Suba a pasta gradle/ do projeto para o repositório."
          fi

      - name: Configurar o Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.wrapper.outputs.has == 'true' && 'wrapper' || '9.1.0' }}

      - name: Colocar o google-services.json (push / Firebase)
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Preparar a assinatura (release)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > release.properties

      - name: Avisar se o release sairá sem assinatura
        if: env.VARIANT == 'release' && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::Release sem keystore - o APK sai sem assinatura e não instala no celular. Crie os segredos KEYSTORE_*."

      - name: Compilar
        run: |
          if [ "${{ steps.wrapper.outputs.has }}" = "true" ]; then
            chmod +x gradlew
            GRADLE_CMD=./gradlew
          else
            GRADLE_CMD=gradle
          fi
          $GRADLE_CMD --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            "assemble${VARIANT^}"

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: lyron-${{ env.VARIANT }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remover arquivos sensíveis do runner
        if: always()
        run: rm -f release.jks release.properties app/google-services.json
